name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m compileall -q src scripts
      - run: pytest -q --ignore=tests/test_desktop_builder.py --ignore=tests/test_desktop_simulation.py --ignore=tests/test_desktop_evacuation.py --ignore=tests/test_desktop_profiles.py --ignore=tests/test_desktop_gpu_inspector.py --ignore=tests/test_preview_factory.py

  microscopic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test,microscopic]"
      - run: pytest -q tests/test_microscopic_motion.py tests/test_hybrid_evacuation.py tests/test_hybrid_elevator.py

  desktop-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[desktop,test]"
      - run: pytest -q tests/test_desktop_builder.py tests/test_desktop_simulation.py tests/test_desktop_evacuation.py tests/test_desktop_profiles.py tests/test_desktop_gpu_inspector.py tests/test_preview_factory.py

  gpu-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 mesa-vulkan-drivers
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[desktop-gpu,test]"
      - run: pytest -q tests/test_gpu_camera.py tests/test_gpu_scene.py tests/test_gpu_culling.py tests/test_gpu_overlay.py tests/test_gpu_selection.py tests/test_gpu_backend.py

  viewer-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm install
      - run: npm run build

  desktop-package-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[desktop-build]"
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: IFCPathBuilder-Windows
          path: dist/IFCPathBuilder/**
          if-no-files-found: error
